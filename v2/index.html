<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#1d4f91">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>BitaObra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concepto: el libro foliado de obra llevado a medio electrónico. Cada nota firmada se muestra
   en papel rayado con letra de imprenta seria, con su número, sus firmas y su sello.
   Azul de plano para la marca, amarillo de señalización solo para "lo que falta". */
:root {
  --bg: #e9edf0;
  --paper: #ffffff;
  --paper-2: #f4f6f8;
  --ink: #17212b;
  --muted: #5b6874;
  --line: #d6dde3;
  --accent: #1d4f91;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebf7;
  --band-1: #1d4f91;
  --band-2: #143a6c;
  --signal: #b77900;
  --signal-soft: #fdf1d6;
  --ok: #1f7a4a;
  --ok-soft: #e0f1e7;
  --bad: #b3261e;
  --bad-soft: #f8e3e1;
  --rule: #c9d6e6;
  --margin-rule: #e4a3a3;
  --sheet: #fffefb;
  --shadow: 0 1px 2px rgba(20, 34, 50, .06), 0 6px 20px rgba(20, 34, 50, .07);
  --shadow-lg: 0 18px 50px rgba(10, 22, 36, .28);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --paper: #18212a; --paper-2: #1e2933; --ink: #e5ebf0; --muted: #9aa9b6; --line: #2b3844;
    --accent: #8db5ee; --accent-ink: #0d1724; --accent-soft: #1d3150;
    --band-1: #1b3b66; --band-2: #122641;
    --signal: #f0be55; --signal-soft: #3a2c10; --ok: #72cf9b; --ok-soft: #153123; --bad: #f2928a; --bad-soft: #3d1d1b;
    --rule: #2f3e4e; --margin-rule: #6b3b3b; --sheet: #1c252e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --paper: #18212a; --paper-2: #1e2933; --ink: #e5ebf0; --muted: #9aa9b6; --line: #2b3844;
  --accent: #8db5ee; --accent-ink: #0d1724; --accent-soft: #1d3150;
  --band-1: #1b3b66; --band-2: #122641;
  --signal: #f0be55; --signal-soft: #3a2c10; --ok: #72cf9b; --ok-soft: #153123; --bad: #f2928a; --bad-soft: #3d1d1b;
  --rule: #2f3e4e; --margin-rule: #6b3b3b; --sheet: #1c252e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; font-variation-settings: "wdth" 100; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band-2); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---------- Encabezado ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; color: #fff;
  background: linear-gradient(120deg, var(--band-1), var(--band-2));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,.14); display: grid; place-items: center; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: .01em; font-variation-settings: "wdth" 80; }
.brand-sub { font-size: 12px; opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-txt { min-width: 0; }
.top-spacer { flex: 1; }
.chip-demo { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: rgba(255,255,255,.16); border-radius: 99px; padding: 3px 9px; white-space: nowrap; }
.icon-btn { border: 0; background: rgba(255,255,255,.12); color: #fff; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: rgba(255,255,255,.22); }

/* ---------- Estructura ---------- */
.shell { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 110px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--paper); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav button { border: 0; background: none; padding: 9px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"] .nav-ico { background: var(--accent-soft); }
.nav-ico { padding: 3px 14px; border-radius: 99px; display: grid; place-items: center; }
@media (min-width: 900px) {
  .shell { grid-template-columns: 200px 1fr; padding-block: 24px 48px; }
  .nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); align-self: start; display: flex; flex-direction: column; gap: 4px;
    border: 0; background: none; padding: 0; }
  .nav button { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 8px 10px; font-size: 14px; border-radius: 10px; }
  .nav button:hover { background: var(--paper); }
  .nav-ico { padding: 4px 8px; }
}
main { min-width: 0; display: grid; gap: 18px; align-content: start; }

/* ---------- Piezas ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px 18px; }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(24px, 4vw, 30px); font-weight: 800; font-variation-settings: "wdth" 85; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; min-height: 40px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.small { min-height: 32px; padding: 5px 10px; font-size: 13.5px; }
.btn.danger { color: var(--bad); }
.btn svg { width: 17px; height: 17px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 2px 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--signal-soft); color: var(--signal); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--paper-2); color: var(--muted); border: 1px solid var(--line); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

/* Medidor de completitud */
.meter { display: grid; gap: 12px; }
.meter-top { display: flex; gap: 14px; align-items: center; }
.ring { width: 84px; height: 84px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .num { font-family: var(--f-display); font-weight: 800; font-size: 25px; line-height: 1; font-variation-settings: "wdth" 80; }
.ring .lbl { font-size: 10.5px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.missing { display: flex; flex-wrap: wrap; gap: 6px; }
.miss { border: 1px dashed var(--signal); background: var(--signal-soft); color: var(--signal); border-radius: 8px; padding: 3px 8px; font-size: 13px; font-weight: 600; }
.miss .mono { font-size: 11.5px; opacity: .85; margin-right: 4px; }

/* Hoja de registro */
.today-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "meter" "ed" "help"; }
.g-meter { grid-area: meter; } .g-ed { grid-area: ed; min-width: 0; } .g-help { grid-area: help; display: grid; gap: 14px; align-content: start; }
.ring .lbl { display: none; }
@media (min-width: 1100px) { .today-grid { gap: 18px; grid-template-columns: minmax(0, 1fr) 310px; grid-template-rows: auto 1fr; grid-template-areas: "ed meter" "ed help"; } .g-meter { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); align-self: start; } }
.sec { padding: 14px 18px 16px; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.sec-h h3 { font-size: 16.5px; font-weight: 700; }
.crit { display: inline-flex; gap: 4px; }
.crit span { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
.crit span.on { border-color: transparent; background: var(--ok-soft); color: var(--ok); }
.crit span.off { border-color: var(--signal); color: var(--signal); background: var(--signal-soft); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label, .lbl-s { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.inp { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--paper-2); border-radius: var(--r-sm); padding: 9px 11px; min-height: 42px; }
.inp:focus { outline: none; border-color: var(--accent); background: var(--paper); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.inp { min-height: 76px; resize: vertical; line-height: 1.45; }
/* Dictado por voz: micrófono dentro de los campos de texto libre */
.mic-wrap { position: relative; display: block; min-width: 0; }
.mic-wrap > .inp { padding-right: 48px; }
.mic { position: absolute; right: 5px; top: 5px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; cursor: pointer; transition: background 0.15s, color 0.15s, transform 0.1s; }
.mic-wrap > input + .mic { top: 50%; margin-top: -17px; }
.mic svg { width: 18px; height: 18px; }
.mic:active { transform: scale(0.92); }
.mic:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mic.rec { background: var(--bad); color: #fff; animation: micPulse 1.2s ease-in-out infinite; }
@keyframes micPulse { 0%, 100% { box-shadow: 0 0 0 0 var(--bad-soft); } 50% { box-shadow: 0 0 0 8px transparent; } }
@media (prefers-reduced-motion: reduce) { .mic.rec { animation: none; } }
.inp[readonly] { background: transparent; border-style: dashed; color: var(--muted); }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper-2); }
.chk > input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.chk .inp { min-height: 34px; padding: 5px 9px; margin-top: 6px; }
.chk-txt { flex: 1; min-width: 0; }
.list { display: grid; gap: 8px; }
.lrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding: 10px; border-radius: var(--r-sm); background: var(--paper-2); border: 1px solid var(--line); }
.lrow > .field { flex: 1 1 120px; min-width: 0; }
.lrow > .field:has(.mic-wrap) { flex-basis: 220px; }
.lrow > .del, .lrow > span:last-child { flex: none; }
.lrow .inp { background: var(--paper); }
.lrow .field label { font-size: 11.5px; }
.del { border: 0; background: none; color: var(--muted); width: 36px; height: 42px; border-radius: 8px; display: grid; place-items: center; }
.del:hover { color: var(--bad); background: var(--bad-soft); }
.tot { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.calc { font-size: 13.5px; background: var(--accent-soft); color: var(--accent); border-radius: var(--r-sm); padding: 8px 11px; font-weight: 600; }
.calc.wide { grid-column: 1 / -1; }

/* Fotos */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--paper-2); border: 1px solid var(--line); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .cap { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10.5px; padding: 3px 6px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.65)); font-family: var(--f-mono); }
.ph .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 99px; border: 0; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; }
.add-ph { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.file-lbl { position: relative; overflow: hidden; }
.file-lbl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* Barra de acciones de la hoja */
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--paper-2); border-radius: 0 0 var(--r) var(--r); }
.lock { display: flex; gap: 10px; align-items: center; padding: 12px 18px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; border-radius: var(--r) var(--r) 0 0; }

/* Clases de nota */
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.type { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; box-shadow: var(--shadow); }
.type:hover { border-color: var(--accent); }
.type h3 { font-size: 17px; font-weight: 700; }
.type p { margin: 0; font-size: 13.5px; color: var(--muted); }
.type .tag { justify-self: start; }
.type-ico { width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }

/* Firmantes y firmas */
.signer { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper-2); }
.signer > div:nth-child(2) { flex: 1; }
.signer-ico { width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.signer-ico.ok { background: var(--ok-soft); color: var(--ok); }
.signer-ico svg { width: 18px; height: 18px; }
.firmas { display: grid; gap: 8px; }
.nuevo-firm > summary { list-style: none; width: max-content; }
.nuevo-firm > summary::-webkit-details-marker { display: none; }
.nuevo-firm[open] > summary { margin-bottom: 4px; }
.verif { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; border-radius: var(--r-sm); padding: 12px 14px; font-size: 14px; }
.verif svg { width: 22px; height: 22px; flex: none; }
.verif > div { min-width: 0; }
.verif.ok { background: var(--ok-soft); color: var(--ok); }
.verif.bad { display: block; background: var(--bad-soft); color: var(--bad); }
.verif .note { color: inherit; opacity: .85; margin-top: 4px; }
.modal-b > .verif { margin-top: 0; }

/* Bitácora (línea de notas) */
.ledger { display: grid; }
.entry { display: grid; grid-template-columns: 62px 1fr auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.entry:first-child { border-top: 0; }
.entry:hover { background: var(--paper-2); }
.folio-no { font-family: var(--f-mono); font-size: 13px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 5px 0; background: var(--paper-2); line-height: 1.2; }
.folio-no b { display: block; font-size: 17px; font-weight: 500; color: var(--ink); }
.folio-no small { font-size: 9.5px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.entry-main { min-width: 0; }
.entry-t { font-weight: 700; }
.entry-s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-r { display: grid; justify-items: end; gap: 4px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { padding: 12px 16px; }
.stat b { font-family: var(--f-display); font-size: 26px; font-weight: 800; display: block; line-height: 1.1; font-variation-settings: "wdth" 80; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }

/* Hoja de libro (texto para transcribir) */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8, 16, 26, .55); display: flex; align-items: flex-end; justify-content: center; padding-top: calc(env(safe-area-inset-top, 0px) + 24px); }
@media (min-width: 760px) { .overlay { align-items: center; padding: 24px; } }
.modal { background: var(--paper); width: 100%; max-width: 760px; max-height: 100%; overflow: auto; border-radius: 18px 18px 0 0; box-shadow: var(--shadow-lg); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 760px) { .modal { border-radius: 18px; max-height: calc(100vh - 48px); } }
.modal-h { position: sticky; top: 0; z-index: 2; background: var(--paper); display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-h h2 { font-size: 19px; font-weight: 800; flex: 1; font-variation-settings: "wdth" 85; }
.modal-b { padding: 16px 18px 20px; display: grid; gap: 14px; }
.close { border: 0; background: var(--paper-2); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.sheet { font-family: var(--f-serif); font-size: 15.5px; line-height: 28px; white-space: pre-wrap; word-wrap: break-word;
  background-color: var(--sheet); background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px);
  background-position: 0 14px; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px 14px 46px; position: relative; overflow-x: auto; }
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 34px; border-left: 2px solid var(--margin-rule); opacity: .7; }
.folio-box { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; padding: 12px; border-radius: var(--r-sm); background: var(--paper-2); border: 1px solid var(--line); }
.note { font-size: 13px; color: var(--muted); }
.confirm { border: 1px solid var(--signal); background: var(--signal-soft); border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 10px; }
.confirm p { margin: 0; font-size: 14px; }

<script>
"use strict";
/* =====================================================================
   BitaObra · bitácora electrónica de obra
   Cada firmante tiene una clave ECDSA P-256 guardada en el teléfono y
   protegida con su PIN; su huella queda registrada en la nota de apertura.
   Al firmar, la nota recibe su número, se sella con su hash SHA-256 y el
   hash de la nota anterior, y ya no se edita: un error se corrige con una
   nota que anula la anterior y la reemplaza. La verificación recalcula la
   cadena y las firmas, así que cualquier alteración posterior se detecta.
   ===================================================================== */

// ---------- Utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const pad = (n, w = 3) => String(n).padStart(w, "0");
const hoyISO = () => isoDe(new Date());
function isoDe(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
function sumarDias(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoDe(d); }
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function fLarga(iso) { if (!has(iso)) return "—"; const d = new Date(iso.slice(0, 10) + "T12:00:00"); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; }
function fCorta(iso) { if (!has(iso)) return "—"; const d = new Date(iso.slice(0, 10) + "T12:00:00"); return `${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}. ${d.getFullYear()}`; }
function fHora(ts) { if (!has(ts)) return "—"; const d = new Date(ts); return `${fCorta(isoDe(d))}, ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; };
const fNum = (v, dec = 2) => new Intl.NumberFormat("es-CO", { maximumFractionDigits: dec }).format(v);
const fCOP = v => new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 }).format(v);
const enIframe = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

// ---------- Almacenamiento (IndexedDB, con respaldo en memoria) ----------
const Store = (() => {
  let db = null;
  function open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open("bitaobra-bitacora", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
        rq.onsuccess = () => { db = rq.result; res(); };
        rq.onerror = () => res();
      } catch (e) { res(); }
    });
  }
  function get(k) {
    return new Promise(res => {
      if (!db) return res(null);
      try { const rq = db.transaction("kv").objectStore("kv").get(k); rq.onsuccess = () => res(rq.result ?? null); rq.onerror = () => res(null); } catch (e) { res(null); }
    });
  }
  function set(k, v) {
    return new Promise(res => {
      if (!db) return res(false);
      try { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); }
    });
  }
  return { open, get, set };
})();

// ---------- Firma electrónica ----------
// Las claves privadas se guardan cifradas con una clave derivada del PIN (PBKDF2 + AES-GCM)
// y nunca salen del dispositivo: la copia JSON solo lleva las claves públicas.
const CR = window.crypto && window.crypto.subtle;
const te = new TextEncoder();
const b64 = buf => { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
async function sha256(txt) { return hex(await CR.digest("SHA-256", te.encode(txt))); }
// JSON canónico: claves ordenadas, para que el mismo contenido dé siempre el mismo hash.
function canon(v) {
  if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
  return JSON.stringify(v ?? null);
}
const ECDSA = { name: "ECDSA", namedCurve: "P-256" }, FIRMA = { name: "ECDSA", hash: "SHA-256" };
const ITER = 150000, CERO = "0".repeat(64);
async function claveDePin(pin, salt) {
  const base = await CR.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return CR.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["wrapKey", "unwrapKey"]);

async function huellaDe(jwk) { const h = await sha256(canon(jwk)); return h.slice(0, 16).toUpperCase().match(/.{4}/g).join(" "); }
async function crearClave(pin) {
  const par = await CR.generateKey(ECDSA, true, ["sign", "verify"]);
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const wrapped = await CR.wrapKey("pkcs8", par.privateKey, await claveDePin(pin, salt), { name: "AES-GCM", iv });
  const pub = await CR.exportKey("jwk", par.publicKey);
  const pubJwk = { crv: pub.crv, kty: pub.kty, x: pub.x, y: pub.y };
  return { pubJwk, huella: await huellaDe(pubJwk), guardada: { w: b64(wrapped), salt: b64(salt), iv: b64(iv) }, privada: par.privateKey };
}

  try { return await CR.unwrapKey("pkcs8", unb64(g.w), await claveDePin(pin, unb64(g.salt)), { name: "AES-GCM", iv: unb64(g.iv) }, ECDSA, false, ["sign"]); }
  catch (e) { return null; }
}
const mensaje = (hash, rol, f, t) => `BitaObra|${hash}|${rol}|${f}|${t}`;
async function firmarCon(priv, msg) { return b64(await CR.sign(FIRMA, priv, te.encode(msg))); }
async function firmaValida(pubJwk, msg, sig) {
  try { const k = await CR.importKey("jwk", Object.assign({ ext: true }, pubJwk), ECDSA, false, ["verify"]); return await CR.verify(FIRMA, k, unb64(sig), te.encode(msg)); }
  catch (e) { return false; }
}

// ---------- Clases de nota ----------
// Los códigos de criterio son los de la lista de verificación del Anexo 1 del documento.
const CLIMA = ["Soleado", "Nublado", "Lluvia ligera", "Lluvia fuerte"];

const PARTES = ["Contratista", "Interventoría", "Entidad contratante"];
const notaSecs = (accion, plazo) => [
  { t: "Asunto y ubicación", c: ["N1"], campos: [{ k: "asunto", l: "Asunto", wide: true }, { k: "ubic", l: "Ubicación o frente", ph: "Eje B entre 2 y 4" }, { k: "fecha", l: "Fecha", ty: "date" }] },

const CLASES = {

  determinacion: { nombre: "Determinación", desc: "Decisión técnica que adoptan las partes: aprobaciones, cambios de procedimiento.", secciones: notaSecs("Decisión adoptada", "Fecha desde la que aplica") },

      { t: "Asunto", c: ["N1"], campos: [{ k: "asunto", l: "Asunto", wide: true }, { k: "fecha", l: "Fecha", ty: "date" }] },
      { t: "Respuesta", c: ["N2"], campos: [{ k: "desc", l: "Respuesta o solución", ty: "textarea", wide: true }] },
      { t: "Estado del asunto", c: ["N6"], campos: [{ k: "estadoRef", l: "El asunto queda", ty: "select", op: ["Resuelto", "En trámite"] }] },

  },
  cierre: {

    secciones: [
      { t: "Cierre", c: ["K1"], campos: [{ k: "fecha", l: "Fecha", ty: "date" }, { k: "motivo", l: "Motivo", ty: "select", op: ["Terminación y recibo final de la obra", "Terminación anticipada del contrato"] }, { k: "soporte", l: "Documento que lo soporta", ph: "Acta de recibo final del…", wide: true }] },

};
const COMUNICACIONES = ["orden", "observacion", "determinacion", "solicitud", "respuesta"];
function secciones(r) {
  const s = CLASES[r.clase].secciones;
  return r.anula ? [{ t: "Nota que se anula", c: ["A1"], campos: [{ calc: "anula" }, { k: "motivoAnula", l: "Motivo de la anulación", ty: "textarea", wide: true }] }, ...s] : s;

const CRIT = {
  D1: ["Fecha", r => has(r.datos.fecha)],
  D2: ["Horario", r => has(r.datos.horaIni) && has(r.datos.horaFin)],
  D3: ["Clima", r => has(r.datos.climaAm) && has(r.datos.climaPm) && has(r.datos.climaAfecta)],
  D4: ["Personal", r => filas(r, "personal", ["cat", "n"])],

  D7: ["Cantidades y unidades", r => filas(r, "actividades", ["cant", "und"])],
  D8: ["Materiales y ensayos", r => has(r.datos.materiales)],
  D9: ["Instrucciones y observaciones", r => has(r.datos.ordenes)],
  D10: ["Seguridad y ambiente", r => has(r.datos.sst)],
  D11: ["Fotos", r => (r.fotos || []).length > 0],

  N2: ["Descripción", r => has(r.datos.desc)],
  N3: ["Acción", r => has(r.datos.accion)],
  N4: ["Plazo", r => has(r.datos.plazo)],
  N5: ["Nota que responde", r => !!S.notas.find(x => x.id === r.datos.ref && x.estado === "firmada")],
  N6: ["Estado del asunto", r => has(r.datos.estadoRef)],
  K1: ["Fecha, motivo y soporte", r => has(r.datos.fecha) && has(r.datos.motivo) && has(r.datos.soporte)],

  const res = secciones(r).flatMap(s => s.c).map(c => ({ c, t: CRIT[c][0], ok: !!CRIT[c][1](r) }));
  const ok = res.filter(x => x.ok).length;
  return { res, ok, total: res.length, pct: res.length ? Math.round(100 * ok / res.length) : 100 };

// ---------- Estado y consultas ----------
let S = null;          // { proyecto, notas }

let tGuardar = null;
function guardar() { clearTimeout(tGuardar); tGuardar = setTimeout(() => Store.set("estado", S), 250); }
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2800);
}
const firmadas = () => S.notas.filter(x => x.estado === "firmada").sort((a, b) => a.n - b.n);
const apertura = () => S.notas.find(x => x.clase === "apertura" && x.estado === "firmada");

const autorizados = () => { const a = apertura(); return a ? a.datos.firmantes : S.proyecto.firmantes; };
const firmante = id => autorizados().find(f => f.id === id) || S.proyecto.firmantes.find(f => f.id === id);
const anuladaPor = r => S.notas.find(x => x.estado === "firmada" && x.anula === r.id);
function nota(id) { return S.notas.find(x => x.id === id); }
// Enterado: lo firma alguien de otra parte. Si vence el plazo de la nota de apertura, se tiene por aceptada.
function estadoEnterado(r) {
  if (r.estado !== "firmada") return null;
  const autor = firmante(r.sello.autor);
  const otros = r.sello.firmas.filter(s => s.rol === "enterado");
  if (r.clase === "apertura") { const faltan = autorizados().filter(f => f.id !== r.sello.autor && !otros.some(s => s.f === f.id)); return faltan.length ? { k: "pend", faltan } : { k: "ok" }; }
  if (otros.some(s => { const f = firmante(s.f); return f && autor && f.parte !== autor.parte; })) return { k: "ok" };
  const a = apertura(); const dias = a ? num(a.datos.diasEnterado) || 3 : 3;
  const vence = sumarDias(isoDe(new Date(r.sello.t)), dias);
  return vence < hoyISO() ? { k: "plazo", vence } : { k: "pend", vence };
}
const pendientes = () => firmadas().filter(r => (estadoEnterado(r) || {}).k === "pend");
function diariaDeHoy() { return S.notas.find(r => r.clase === "diaria" && r.estado === "borrador" && r.datos.fecha === hoyISO()) || S.notas.find(r => r.clase === "diaria" && r.estado === "firmada" && r.datos.fecha === hoyISO()); }
function nuevaNota(clase, base = {}) {
  const r = { id: uid(), clase, estado: "borrador", n: null, fotos: [], creado: new Date().toISOString(), datos: Object.assign({ fecha: hoyISO() }, base) };
  if (clase === "diaria") Object.assign(r.datos, { horaIni: "07:00", horaFin: "17:00", personal: [], equipos: [], actividades: [] }, base);
  S.notas.push(r); guardar(); return r;
}

// ---------- Sello y verificación ----------
function contenido(r) { return { n: r.n, clase: r.clase, datos: r.datos, fotos: r.fotosHash || [], anula: r.anula || null, autor: r.sello.autor, t: r.sello.t, hashPrev: r.sello.hashPrev }; }
async function sellar(r, f, priv, t = new Date().toISOString()) {
  const prev = firmadas().pop();

  return `<div class="meter"><div class="meter-top">${ring(e.pct)}<div><div class="eyebrow">Contenidos mínimos</div><div style="font-weight:700;font-size:16px">${e.ok} de ${e.total} criterios</div>
    ${falta.length ? `<div class="note">Toque un pendiente para ir al campo.</div>` : `<div class="pill ok" style="margin-top:6px">Lista para firmar</div>`}</div></div>
    ${falta.length ? `<div class="missing">${falta.map(x => `<button class="miss" data-goto="${x.c}"><span class="mono">${x.c}</span>${esc(x.t)}</button>`).join("")}</div>` : ""}</div>`;
}
function estadoPill(r) {
  if (r.estado !== "firmada") return `<span class="pill idle">Borrador</span>`;
  const an = anuladaPor(r); if (an) return `<span class="pill bad">Anulada por N.º ${pad(an.n)}</span>`;
  const e = estadoEnterado(r);
  return e.k === "ok" ? `<span class="pill ok">Firmada</span>` : e.k === "plazo" ? `<span class="pill ok">Aceptada por plazo</span>` : `<span class="pill warn">Falta enterado</span>`;
}
function inputHtml(c, val, path, ro) {
  const id = `f-${path.replace(/[^a-z0-9]/gi, "-")}`;
  const dis = ro ? " disabled" : "";
  const ph = c.ph ? ` placeholder="${esc(c.ph)}"` : "";
  let ctl;
  if (c.ty === "textarea") ctl = `<textarea class="inp" id="${id}" data-p="${path}"${ph}${dis}>${esc(val)}</textarea>`;
  else if (c.ty === "select") ctl = `<select class="inp" id="${id}" data-p="${path}"${dis}><option value="">Elegir…</option>${c.op.map(o => `<option${o === val ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (c.ty === "ref") {
    const ns = firmadas().filter(x => ["orden", "solicitud", "observacion"].includes(x.clase) && !anuladaPor(x));
    ctl = `<select class="inp" id="${id}" data-p="${path}"${dis}><option value="">${ns.length ? "Elegir…" : "No hay órdenes, solicitudes ni observaciones firmadas"}</option>${ns.map(s => `<option value="${s.id}"${s.id === val ? " selected" : ""}>N.º ${pad(s.n)} · ${esc(CLASES[s.clase].nombre)} · ${esc(s.datos.asunto || "")}</option>`).join("")}</select>`;
  }
  else ctl = `<input class="inp" id="${id}" data-p="${path}" type="${c.ty === "number" ? "number" : c.ty || "text"}"${c.ty === "number" ? ' inputmode="decimal" step="any"' : ""} value="${esc(val)}"${ph}${dis}>`;
  if (!ro && (c.ty === "textarea" || ((!c.ty || c.ty === "text") && CON_VOZ.includes(c.k)))) ctl = micHtml(ctl, id);
  return `<div class="field${c.wide ? " wide" : ""}"><label for="${id}">${esc(c.l || "")}</label>${ctl}</div>`;
}
// Campos de texto libre que llevan micrófono: todas las áreas de texto y estos campos de una línea.
const CON_VOZ = ["desc", "loc", "asunto", "ubic", "climaAfecta"];
const micHtml = (ctl, id) => `<span class="mic-wrap">${ctl}<button type="button" class="mic" data-mic="${id}" title="Dictar por voz" aria-label="Dictar por voz" aria-pressed="false">${I.mic}</button></span>`;
function calcHtml(tipo, r) {
  if (tipo === "anula") { const o = nota(r.anula); return o ? `Al firmarse, esta nota anula la nota N.º ${pad(o.n)} (${esc(CLASES[o.clase].nombre.toLowerCase())} del ${fCorta(o.datos.fecha)}) y queda en su lugar.` : ""; }
  return "";
}
function campoHtml(c, r, ro) {
  const d = r.datos;
  if (c.calc) return `<div class="calc wide" data-calc="${c.calc}">${calcHtml(c.calc, r)}</div>`;
  if (c.ty === "list") {
    const a = d[c.k] || [];
    const rows = a.map((row, i) => `<div class="lrow">${c.f.map(f => inputHtml(f, row[f.k] || "", `${c.k}.${i}.${f.k}`, ro)).join("")}${ro ? "<span></span>" : `<button class="del" data-del="${c.k}.${i}" aria-label="Quitar fila">${I.x}</button>`}</div>`).join("");
    return `<div class="field wide"><div class="list">${rows || `<div class="note">Sin filas todavía.</div>`}</div>${ro ? "" : `<div><button class="btn small ghost" data-addrow="${c.k}">${I.plus}${esc(c.add)}</button></div>`}</div>`;
  }
  return inputHtml(c, d[c.k] || "", c.k, ro);
}
function seccionesHtml(r) {
  const e = evalua(r); const okDe = Object.fromEntries(e.res.map(x => [x.c, x.ok]));
  return secciones(r).map((s, si) => {
    const crit = s.c.length ? `<span class="crit">${s.c.map(c => `<span class="${okDe[c] ? "on" : "off"}" title="${esc(CRIT[c][0])}">${c}</span>`).join("")}</span>` : `<span class="note">Opcional</span>`;
    const body = s.fotos ? fotosHtml(r, false) : `<div class="fields">${s.campos.map(c => campoHtml(c, r, false)).join("")}</div>`;
    return `<section class="sec" id="sec-${s.c[0] || "fotos"}" data-sec="${si}"><div class="sec-h"><h3>${esc(s.t)}</h3>${crit}</div>${body}</section>`;
  }).join("");
}
function fotosHtml(r, ro) {
  const f = r.fotos || [];
  const grid = f.length ? `<div class="photos">${f.map((p, i) => `<div class="ph"><img src="${p.src}" alt="${esc(p.nombre || "Foto " + (i + 1))}"><div class="cap">${esc((p.fecha || "").replace("T", " ").slice(0, 16))}${p.lat ? ` · ${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}` : ""}</div>${ro ? "" : `<button class="x" data-delfoto="${i}" aria-label="Quitar foto">${I.x}</button>`}</div>`).join("")}</div>` : `<div class="note">Sin fotos. Cada foto guarda su fecha y, si el teléfono lo permite, la ubicación. Al firmar, su huella queda sellada en la nota.</div>`;
  const add = ro ? "" : `<div class="add-ph"><label class="btn small file-lbl">${I.cam}Tomar foto<input type="file" accept="image/*" capture="environment" data-foto></label><label class="btn small file-lbl">${I.img}Adjuntar fotos<input type="file" accept="image/*" multiple data-foto></label></div>`;
  return grid + add;
}
function editorHtml(r) {
  return `<div class="card" data-editor="${r.id}">${seccionesHtml(r)}<div class="sheet-actions"><button class="btn danger" data-borrar="${r.id}">Descartar borrador</button><button class="btn" data-ver="${r.id}">${I.book}Vista previa</button><button class="btn primary" data-pedir-firma="${r.id}">${I.pen}Firmar nota</button></div></div>`;
}
function entradaHtml(r) {
  const e = evalua(r); const d = r.datos;
  const sub = r.clase === "diaria" ? ((d.actividades || []).map(a => a.desc).filter(Boolean).join(" · ") || "Sin actividades") : r.clase === "apertura" ? `${(d.firmantes || []).length} firmantes autorizados` : (d.asunto || d.motivo || CLASES[r.clase].desc);
  const autor = r.estado === "firmada" ? firmante(r.sello.autor) : null;

    <div class="entry-main"><div class="entry-t">${esc(CLASES[r.clase].nombre)} <span class="muted" style="font-weight:400">· ${fCorta(d.fecha)}${autor ? ` · ${esc(autor.nombre)}` : ""}</span>${r.anula ? ` <span class="pill accent">Reemplaza</span>` : ""}</div><div class="entry-s">${esc(sub)}</div></div>
    <div class="entry-r">${e.total ? pillPct(e.pct) : ""}${estadoPill(r)}</div></button>`;

async function generarPDF(notas, nombre) {
  if (!window.jspdf) { toast("No se pudo cargar el generador de PDF. Revise la conexión y vuelva a abrir la app."); return; }
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: "mm", format: "letter" });
  const p = S.proyecto, W = 215.9, M = 18; let y;
  const encabezado = () => {
    y = 16;
    if (p.logo) { try { doc.addImage(p.logo, M, y - 4, 22, 22, undefined, "FAST"); } catch (e) {} }
    const x0 = p.logo ? M + 26 : M;
    doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(20); doc.text(p.interventoria || "Interventoría", x0, y + 2);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(80);
    doc.text(`Bitácora electrónica · Contrato ${p.contrato || "—"} · ${p.contratista || ""}`, x0, y + 8);
    doc.text(doc.splitTextToSize(p.objeto || "", W - x0 - M).slice(0, 2), x0, y + 13);
    y += 24; doc.setDrawColor(29, 79, 145); doc.setLineWidth(.6); doc.line(M, y, W - M, y); y += 8;
  };
  const salto = alto => { if (y + alto > 258) { doc.addPage(); y = 20; } };
  notas.forEach((r, k) => {
    if (k) doc.addPage();
    encabezado();
    doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(29, 79, 145);
    doc.text(`${CLASES[r.clase].nombre} · ${r.n ? "Nota N.º " + pad(r.n) : "Borrador"}`, M, y); y += 6;
    const e = evalua(r);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(90);
    doc.text(`${anuladaPor(r) ? `ANULADA por la nota N.º ${pad(anuladaPor(r).n)} · ` : ""}${e.total ? `Completitud: ${e.pct} % de los contenidos mínimos` : ""}`, M, y); y += 8;
    doc.setFont("times", "normal"); doc.setFontSize(11); doc.setTextColor(20);
    for (const l of doc.splitTextToSize(texto(r).split("\n").slice(2).join("\n"), W - 2 * M)) { salto(6); doc.text(l, M, y); y += 5.4; }
    const fotos = r.fotos || [];
    if (fotos.length) {
      y += 4; salto(60);
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.text("Registro fotográfico", M, y); y += 5;
      const cw = (W - 2 * M - 8) / 2, ch = cw * .75;
      for (let i = 0; i < fotos.length; i++) {
        const col = i % 2; if (col === 0) salto(ch + 10);
        const x = M + col * (cw + 8);
        try { doc.addImage(fotos[i].src, "JPEG", x, y, cw, ch, undefined, "FAST"); } catch (e) {}
        doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(80);
        doc.text(`Foto ${i + 1} · ${(fotos[i].fecha || "").replace("T", " ").slice(0, 16)}${fotos[i].lat ? ` · ${fotos[i].lat.toFixed(5)}, ${fotos[i].lon.toFixed(5)}` : ""}`, x, y + ch + 4);
        doc.setTextColor(20); if (col === 1 || i === fotos.length - 1) y += ch + 10;
      }
    }
    if (r.estado === "firmada") {
      y += 4; salto(30);
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(20); doc.text("Firmas electrónicas", M, y); y += 5;
      doc.setFont("helvetica", "normal"); doc.setFontSize(9);
      for (const l of doc.splitTextToSize(firmasTexto(r).split("\n").slice(2).map(s => s.trim()).join("\n"), W - 2 * M)) { salto(5); doc.text(l, M, y); y += 4.4; }
    }
  });
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(110);
    doc.text(`Generado con BitaObra el ${fCorta(hoyISO())}. Las firmas se verifican con la copia JSON de la bitácora.`, M, 270); doc.text(`Página ${i} de ${n}`, W - M, 270, { align: "right" }); }
  await ofrecerArchivo(nombre, doc.output("blob"), "PDF");
}

// En la app instalada se descarga directo; dentro del visor web se pide permiso al visor.
let descargas;
async function ofrecerArchivo(nombre, blob, que) {

// ---------- Fotos ----------
function leerFoto(file) {
  return new Promise(res => {
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const f = new Date(file.lastModified || Date.now());
      res({ src: c.toDataURL("image/jpeg", .72), fecha: `${isoDe(f)}T${String(f.getHours()).padStart(2, "0")}:${String(f.getMinutes()).padStart(2, "0")}`, nombre: file.name });
    }; img.onerror = () => res(null); img.src = rd.result; };
    rd.onerror = () => res(null); rd.readAsDataURL(file);
  });
}
function ubicacion() {
  return new Promise(res => { try { navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), () => res(null), { timeout: 5000, maximumAge: 60000 }); } catch (e) { res(null); } });
}

// ---------- Dictado por voz ----------
// Usa el reconocimiento de voz del navegador (Chrome en Android, Safari en iPhone). Cada sesión es corta
// (continuous = false) porque en Chrome para Android el modo continuo repite o pierde frases; mientras el botón
// siga activo se abre otra sesión y lo reconocido se agrega al campo. Necesita conexión a internet.

  if (d.nueva) {
    if (!apertura() || cerrada()) return toast("La bitácora no admite notas nuevas.");
    if (d.nueva === "cierre" && S.notas.some(x => x.clase === "cierre" && x.estado === "borrador")) return abrirBorrador(S.notas.find(x => x.clase === "cierre" && x.estado === "borrador"));
    const r = nuevaNota(d.nueva); ui.abierto = r.id; ui.view = d.nueva === "diaria" ? "hoy" : "notas"; render(); window.scrollTo(0, 0); return;
  }
  if (d.abrir) { const r = nota(d.abrir); if (!r) return; return r.estado === "firmada" ? verNota(r) : abrirBorrador(r); }
  if (d.volver !== undefined) { ui.abierto = null; render(); return; }
  if (d.addrow) { const r = regActual(); (r.datos[d.addrow] = r.datos[d.addrow] || []).push({}); guardar(); render(); return; }
  if (d.del) { const r = regActual(); const [k, i] = d.del.split("."); r.datos[k].splice(+i, 1); guardar(); render(); return; }
  if (d.delfoto) { const r = regActual(); r.fotos.splice(+d.delfoto, 1); guardar(); render(); return; }
  if (d.goto) { const el = document.getElementById("sec-" + d.goto) || [...document.querySelectorAll(".sec")].find(s => s.querySelector(".crit")?.textContent.includes(d.goto));
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); const f = el.querySelector("input:not([type=file]), select, textarea"); f && setTimeout(() => f.focus({ preventScroll: true }), 350); } return; }
  if (d.ver) return verNota(nota(d.ver));
  if (d.pedirFirma) return pedirFirma(nota(d.pedirFirma), "autor");
  if (d.pedirEnterado) return pedirFirma(nota(d.pedirEnterado), "enterado");
  if (d.firmar) return firmar(d.firmar, d.rol, b);
  if (d.cerrarModal !== undefined) return cerrarModal();
  if (d.borrar) { const r = nota(d.borrar); if (!r) return;
    if (b.dataset.armado !== "1") { b.dataset.armado = "1"; b.textContent = "Toque otra vez para descartar"; setTimeout(() => { if (b.isConnected) { b.dataset.armado = ""; b.textContent = "Descartar borrador"; } }, 3000); return; }
    S.notas = S.notas.filter(x => x.id !== r.id); ui.abierto = null; guardar(); render(); toast("Borrador descartado"); return; }
  if (d.anular) { const o = nota(d.anular); const r = nuevaNota(o.clase, JSON.parse(JSON.stringify(o.datos))); r.datos.fecha = hoyISO(); r.datos.motivoAnula = ""; r.anula = o.id; r.fotos = (o.fotos || []).slice();
    cerrarModal(); ui.abierto = r.id; ui.view = "notas"; guardar(); render(); window.scrollTo(0, 0); toast("Nota de reemplazo creada como borrador"); return; }
  if (d.copiar) { const r = nota(d.copiar); const t = texto(r) + firmasTexto(r);
    try { await navigator.clipboard.writeText(t); toast("Texto copiado"); }
    catch (err) { const s = $("#sheet-txt"); const rg = document.createRange(); rg.selectNodeContents(s); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); toast("Texto seleccionado: cópielo con el menú del teléfono"); } return; }
  if (d.pdf) { const r = nota(d.pdf); return generarPDF([r], `${r.clase}-${S.proyecto.contrato || "contrato"}-${r.n ? pad(r.n) : "borrador"}.pdf`); }
  if (d.pdfTodo !== undefined) { const fs = firmadas(); if (!fs.length) return toast("Aún no hay notas firmadas."); return generarPDF(fs, `bitacora-${S.proyecto.contrato || "contrato"}-${hoyISO()}.pdf`); }
  if (d.filtro) { ui.filtro = d.filtro; render(); return; }
  if (d.verificar !== undefined) { b.disabled = true; const v = await verificar(S); b.disabled = false; $("#verif").innerHTML = verifHtml(v); return; }
  if (d.simular !== undefined) {
    // Copia en memoria con un dato cambiado: los datos guardados no se tocan.
    const copia = JSON.parse(JSON.stringify(S)); const obj = copia.notas.filter(x => x.estado === "firmada" && x.clase === "diaria").sort((a, b) => a.n - b.n)[1];
    if (!obj) return;
    const a = obj.datos.actividades[0]; const antes = a.cant; a.cant = String(num(a.cant) * 2);
    const v = await verificar(copia);
    $("#verif").innerHTML = verifHtml(v, `Se cambió la cantidad «${a.desc}» de la nota N.º ${pad(obj.n)} de ${antes} a ${a.cant} ${a.und}.`); return;
  }
  if (d.exportar !== undefined) {
    await ofrecerArchivo(`bitacora-${S.proyecto.contrato || "proyecto"}-${hoyISO()}.json`, new Blob([JSON.stringify(S)], { type: "application/json" }), "Copia");
    return; }
  if (d.crearFirm !== undefined) {
    if (!CR) return msgEn("#nf-msg", "La firma necesita abrir la app con https.");
    const v = id => ($(id).value || "").trim();
    const nombre = v("#nf-nombre"), doc = v("#nf-doc"), mat = v("#nf-mat"), cargo = v("#nf-cargo"), parte = v("#nf-parte"), pin = $("#nf-pin").value, pin2 = $("#nf-pin2").value;
    if (!nombre || !doc || !cargo) return msgEn("#nf-msg", "Escriba el nombre, la cédula y el cargo.");
    if (!/^\d{6,}$/.test(pin)) return msgEn("#nf-msg", "El PIN debe tener al menos 6 dígitos.");
    if (pin !== pin2) return msgEn("#nf-msg", "Los dos PIN no coinciden.");
    b.disabled = true; b.textContent = "Creando la firma…";
    const k = await crearClave(pin);
    const f = { id: uid(), nombre, doc, mat, cargo, parte, pubJwk: k.pubJwk, huella: k.huella };
    S.proyecto.firmantes.push(f); CLAVES[f.id] = k.guardada;
    await Store.set("claves", CLAVES); await Store.set("estado", S); render(); toast(`Firma de ${nombre} creada. Huella ${k.huella}`); return; }
  if (d.delfirm) {
    if (b.dataset.armado !== "1") { b.dataset.armado = "1"; b.style.color = "var(--bad)"; toast("Toque otra vez para quitar al firmante"); return; }
    S.proyecto.firmantes = S.proyecto.firmantes.filter(x => x.id !== d.delfirm); delete CLAVES[d.delfirm]; await Store.set("claves", CLAVES); guardar(); render(); return; }
  if (d.abrirBitacora !== undefined) {
    const p = S.proyecto, fs = p.firmantes || [], cfg = p.cfg || {};
    if (!["contrato", "objeto", "contratista", "interventoria", "entidad"].every(k => has(p[k]))) return msgEn("#ap-msg", "Complete el número, la entidad, el objeto, el contratista y la interventoría del contrato.");
    if (new Set(fs.map(f => f.parte)).size < 2) return msgEn("#ap-msg", "Registre al menos un firmante del contratista y uno de la interventoría.");
    let r = S.notas.find(x => x.clase === "apertura" && x.estado === "borrador");
    if (!r) { r = { id: uid(), clase: "apertura", estado: "borrador", n: null, fotos: [], creado: new Date().toISOString(), datos: {} }; S.notas.push(r); }
    r.datos = { fecha: cfg.fechaRTI || hoyISO(), contrato: contratoSnap(p), firmantes: fs.map(f => Object.assign({}, f)), horaIni: cfg.horaIni || "07:00", horaFin: cfg.horaFin || "18:00", diasEnterado: cfg.diasEnterado || "3" };
    guardar(); return pedirFirma(r, "autor"); }
  if (d.limpiar !== undefined) {
    if (b.dataset.armado !== "1") { b.dataset.armado = "1"; b.textContent = "Toque otra vez: se borra el ejemplo"; return; }
    S = { proyecto: { demo: false, lugar: "", plazo: "", valor: "", firmantes: [] }, notas: [] }; CLAVES = {}; await Store.set("claves", CLAVES);
    ui.abierto = null; ui.view = "proyecto"; guardar(); render(); toast("Proyecto en blanco. Llene el contrato y registre a los firmantes."); return; }
});
$("#btn-theme").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; try { localStorage.setItem("bitaobra-tema", nx); } catch (e) {}
});

// ---------- Arranque ----------
(async function () {
  try { const t = localStorage.getItem("bitaobra-tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  await Store.open();
  S = await Store.get("estado"); CLAVES = (await Store.get("claves")) || {};
  if (!S || !S.proyecto || !Array.isArray(S.notas)) {
    if (CR) { $("#main").innerHTML = `<div class="card pad empty">Preparando el contrato de ejemplo y las firmas…</div>`; await ejemplo(); await Store.set("estado", S); }
    else S = { proyecto: { demo: false, firmantes: [] }, notas: [] };
  }
  if (!CR) toast("Abra la app con https para poder firmar.");
  render();
  if ("serviceWorker" in navigator && !enIframe && location.protocol.startsWith("http")) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
})();
</script>
