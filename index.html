/* ---------- integridad: cadena de hashes ---------- */
function entryPayload(e) {
  return JSON.stringify([e.folio, e.tipo, e.fechaHechos, e.registradoAt, e.autorRol, e.autorNombre, e.clima, e.personal, e.equipos, e.actividades, e.texto,
    (e.evidencias || []).map(v => [v.at, v.lat, v.lon, sha256(v.img || "")]), e.solicitud ? [e.solicitud.categoria, e.solicitud.venceAt] : null, e.refFolio || null, e.firma ? [e.firma.nombre, e.firma.at, sha256(e.firma.img || "")] : null]
    .concat(e.nc ? [[e.nc.requisito, e.nc.severidad, e.nc.plazo, e.nc.venceAt]] : [])
    .concat(e.eficaz != null ? [e.eficaz] : []));
}
function sealEntry(p, e) {
  const prev = p.asientos.length ? p.asientos[p.asientos.length - 1].hash : "0".repeat(64);
  e.prevHash = prev;
  e.hash = sha256(prev + entryPayload(e));
}
function verifyChain(p) {
  let prev = "0".repeat(64);
  for (const e of p.asientos) {
    if (e.prevHash !== prev || sha256(prev + entryPayload(e)) !== e.hash) return { ok: false, folio: e.folio };
    prev = e.hash;
  }
  return { ok: true };
}

/* ---------- solicitudes: semáforo ---------- */
function solicitudEstado(p, e, now = Date.now()) {
  const s = e.solicitud;
  if (s.respuestaFolio) {
    const r = p.asientos.find(x => x.folio === s.respuestaFolio);
    const dias = businessDaysBetween(e.registradoAt, r.registradoAt);
    const aTiempo = r.registradoAt <= s.venceAt;
    return { clase: aTiempo ? "ok" : "bad", texto: aTiempo ? "Respondida a tiempo" : "Respondida tarde", dias, cerrada: true };
  }
  const restante = businessDaysBetween(now, s.venceAt);
  if (now > s.venceAt) return { clase: "bad", texto: "Vencida", dias: businessDaysBetween(e.registradoAt, now), cerrada: false };
  if (restante <= 1) return { clase: "warn", texto: "Por vencer", dias: businessDaysBetween(e.registradoAt, now), cerrada: false };
  return { clase: "info", texto: "En plazo", dias: businessDaysBetween(e.registradoAt, now), cerrada: false };
}

/* ---------- no conformidades: estado ---------- */
function ncEstado(p, e, now = Date.now()) {
  const n = e.nc;
  if (n.cierreFolio) {
    const c = p.asientos.find(x => x.folio === n.cierreFolio);
    const ok = c.registradoAt <= n.venceAt;
    return { clase: ok ? "ok" : "bad", texto: ok ? "Cerrada a tiempo" : "Cerrada tarde", cerrada: true, vencida: false };
  }
  const vencida = now > n.venceAt;
  if (n.correccionFolio) return { clase: vencida ? "bad" : "info", texto: "Corregida, por verificar", cerrada: false, vencida };
  if (vencida) return { clase: "bad", texto: "Vencida", cerrada: false, vencida };
  if (businessDaysBetween(now, n.venceAt) <= 1) return { clase: "warn", texto: "Por vencer", cerrada: false, vencida };
  return { clase: "info", texto: "Abierta en plazo", cerrada: false, vencida };
}

/* ---------- completitud (criterios del Anexo 1) ---------- */
function completitud(e) {
  const c = [
    isoDay(e.fechaHechos) === isoDay(e.registradoAt),
    !!e.clima, e.personal !== "" && e.personal != null, !!(e.equipos && e.equipos.trim()),
    !!(e.actividades && e.actividades.trim()), (e.evidencias || []).length > 0, !!e.firma
  ];
  return c.filter(Boolean).length / c.length;
}

/* ---------- indicadores ---------- */
function indicadores(p, now = Date.now()) {
  const sol = p.asientos.filter(e => e.tipo === "solicitud");
  const est = sol.map(e => ({ e, s: solicitudEstado(p, e, now) }));
  const cerradas = est.filter(x => x.s.cerrada);
  const tiempos = cerradas.map(x => x.s.dias);
  const aTiempo = cerradas.filter(x => x.s.clase === "ok").length;
  const vencidasAb = est.filter(x => !x.s.cerrada && x.s.clase === "bad");
  const ip2 = vencidasAb.length ? Math.max(...vencidasAb.map(x => businessDaysBetween(x.e.solicitud.venceAt, now))) : 0;
  // No conformidades (INC1 a INC3)
  const ncs = p.asientos.filter(e => e.tipo === "noConformidad").map(e => ({ e, s: ncEstado(p, e, now) }));
  const ncAb = ncs.filter(x => !x.s.cerrada);
  const ncCer = ncs.filter(x => x.s.cerrada);
  const ncVenAb = ncAb.filter(x => x.s.vencida).length;
  const ncDen = ncCer.length + ncVenAb;
  // INC3: NC cuyo requisito coincide con el de una NC ya cerrada cuando se registró
  let reinc = 0;
  ncs.forEach(x => { const r = normReq(x.e.nc.requisito); if (ncs.some(y => y.e.folio < x.e.folio && y.s.cerrada && normReq(y.e.nc.requisito) === r && p.asientos.find(z => z.folio === y.e.nc.cierreFolio).registradoAt < x.e.registradoAt)) reinc++; });
  const diarios = p.asientos.filter(e => e.tipo === "diario");
  const comp = diarios.length ? diarios.reduce((a, e) => a + completitud(e), 0) / diarios.length : null;
  const oportunos = diarios.filter(e => isoDay(e.fechaHechos) === isoDay(e.registradoAt)).length;
  let diasSin = null, avance = null;
  if (p.acta.suscrita) {
    const inicio = p.acta.fechaInicio;
    const dias = new Set(diarios.map(e => isoDay(e.fechaHechos)));
    let falt = 0;
    for (let t = inicio; t <= Math.min(now, inicio + p.plazoDias * DAY); t += DAY) { const d = new Date(t); if (isWeekday(d) && !dias.has(isoDay(d)) && isoDay(d) !== isoDay(now)) falt++; }
    diasSin = falt;
    avance = Math.max(0, Math.min(1, (now - inicio) / (p.plazoDias * DAY)));
  }
  return {
    total: sol.length, abiertas: est.filter(x => !x.s.cerrada).length,
    vencidas: est.filter(x => !x.s.cerrada && x.s.clase === "bad").length,
    porVencer: est.filter(x => !x.s.cerrada && x.s.clase === "warn").length,
    mediana: median(tiempos), p90: percentil(tiempos, 0.9), ip2,
    // IR2: las solicitudes abiertas vencidas cuentan como incumplidas (evita el sesgo de supervivencia)
    pctATiempo: (cerradas.length + vencidasAb.length) ? aTiempo / (cerradas.length + vencidasAb.length) : null, cerradas: cerradas.length,
    ncTotal: ncs.length, ncAbiertas: ncAb.length, ncCriticas: ncAb.filter(x => x.e.nc.severidad === "critica").length,
    ncMayores: ncAb.filter(x => x.e.nc.severidad === "mayor").length, ncMenores: ncAb.filter(x => x.e.nc.severidad === "menor").length,
    pctNC: ncDen ? ncCer.filter(x => x.s.clase === "ok").length / ncDen : null, reinc: ncs.length ? reinc / ncs.length : null,
    comp, oportunidad: diarios.length ? oportunos / diarios.length : null, diarios: diarios.length, diasSin, avance
  };
}

function freshState() {
  const p = buildSample();
  return { projects: [p], current: p.id, role: "contratista", tab: "resumen" };
}

/* ---------- interfaz general ---------- */
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function setTab(tab) { state.tab = tab; save(); render(); window.scrollTo(0, 0); }
function render() {
  const p = P();
  $("#roleSel").value = state.role;
  $("#projSel").innerHTML = state.projects.map(x => `<option value="${x.id}" ${x.id === state.current ? "selected" : ""}>${esc(x.contrato || "Proyecto sin número")}${x.ejemplo ? " (ejemplo)" : ""}</option>`).join("") + `<option value="__new">+ Nuevo proyecto</option>`;
  $("#projName").textContent = p.objeto || "Proyecto nuevo";
  const ind = indicadores(p);
  document.querySelectorAll("#tabs button").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.tab === state.tab ? "true" : "false");
    if (b.dataset.tab === "solicitudes") b.innerHTML = "Solicitudes" + (ind.vencidas ? `<span class="count">${ind.vencidas}</span>` : "");
    if (b.dataset.tab === "nc") b.innerHTML = "No conformidades" + (ind.ncCriticas ? `<span class="count">${ind.ncCriticas}</span>` : "");
  });
  const v = $("#view");
  const banner = p.ejemplo ? `<div class="example-banner">Proyecto de <b>ejemplo</b> con datos ficticios para demostrar el flujo. Cree uno nuevo desde el selector de proyectos para trabajar con datos reales.</div>` : "";
  const views = { resumen: viewResumen, acta: viewActa, bitacora: viewBitacora, solicitudes: viewSolicitudes, nc: viewNC, reporte: viewReporte, proyecto: viewProyecto };
  v.innerHTML = banner + (storageOk ? "" : `<div class="example-banner">Este navegador no permite guardar datos; los cambios se perderán al cerrar la página.</div>`) + views[state.tab](p, ind);
  bindView(p);
}

/* ---------- vista: resumen ---------- */
function kpi(label, value, cls = "", sub = "") { return `<div class="kpi ${cls}"><span class="label">${label}</span><span class="v">${value}</span>${sub ? `<span class="small muted">${sub}</span>` : ""}</div>`; }
function pct(x) { return x == null ? "—" : Math.round(x * 100) + "<small> %</small>"; }
const dias = x => x == null ? "—" : x.toFixed(1).replace(".", ",");
// Tablero del ciclo PHVA: cada indicador con su valor acumulado, la meta y el estado.
function tablero(p, ind) {
  const pc = x => x == null ? "—" : Math.round(x * 100) + " %";
  const st = (cond, warn) => cond == null ? ["idle", "Sin datos"] : cond ? ["ok", "Cumple"] : warn ? ["warn", "Vigilar"] : ["bad", "Actuar"];
  return [
    ["Capacidad de respuesta"],
    ["IR1", "Tiempo de respuesta (mediana / P90)", `${dias(ind.mediana)} / ${dias(ind.p90)} días háb.`, `P90 ≤ ${p.plazoRespuesta}`, st(ind.p90 == null ? null : ind.p90 <= p.plazoRespuesta)],
    ["IR2", "Cumplimiento del plazo de respuesta", pc(ind.pctATiempo), "≥ 90 %", st(ind.pctATiempo == null ? null : ind.pctATiempo >= 0.9)],
    ["Pendientes vencidos"],
    ["IP1", "Solicitudes vencidas", String(ind.vencidas), "0", st(ind.vencidas === 0)],
    ["IP2", "Antigüedad del atraso", `${dias(ind.ip2)} días háb.`, "0", ind.ip2 === 0 ? ["ok", "Cumple"] : ind.ip2 <= 2 ? ["warn", "Vigilar"] : ["bad", "Actuar"]],
    ["No conformidades"],
    ["INC1", "NC abiertas (crít. / may. / men.)", `${ind.ncCriticas} / ${ind.ncMayores} / ${ind.ncMenores}`, "0 críticas", ind.ncCriticas ? ["bad", "Actuar"] : ind.ncAbiertas ? ["warn", "Vigilar"] : ["ok", "Cumple"]],
    ["INC2", "Cierre oportuno de NC", pc(ind.pctNC), "≥ 80 %", st(ind.pctNC == null ? null : ind.pctNC >= 0.8)],
    ["INC3", "Reincidencia", pc(ind.reinc), "≤ 10 %", st(ind.reinc == null ? null : ind.reinc <= 0.1)],
    ["Orden del registro"],
    ["IO1", "Registro el mismo día", pc(ind.oportunidad), "≥ 90 %", st(ind.oportunidad == null ? null : ind.oportunidad >= 0.9)],
    ["IO2", "Completitud del registro", ind.comp == null ? "—" : ind.comp.toFixed(2).replace(".", ","), "≥ 0,90", st(ind.comp == null ? null : ind.comp >= 0.9)],
    ["IO3", "Días hábiles sin registro", String(ind.diasSin ?? "—"), "0", st(ind.diasSin == null ? null : ind.diasSin === 0)]
  ];
}
function viewResumen(p, ind) {
  if (!p.acta.suscrita) return `<section class="panel"><h2>El contrato aún no ha iniciado</h2><p class="muted">La bitácora y las solicitudes se habilitan cuando el acta de inicio esté suscrita por el contratista y la interventoría.</p><div><button class="btn primary" data-go="acta">Ir al acta de inicio</button></div></section>`;
  const fin = p.acta.fechaInicio + p.plazoDias * DAY;
  const chain = verifyChain(p);
  const rows = tablero(p, ind);
  const alertas = rows.filter(r => r.length > 1 && r[4][0] === "bad");
  const medCls = ind.mediana == null ? "" : ind.mediana <= p.plazoRespuesta ? "good" : "bad";
  const openRows = p.asientos.filter(e => e.tipo === "solicitud").map(e => ({ e, s: solicitudEstado(p, e) })).filter(x => !x.s.cerrada);
  const mejoras = p.mejoras || [];
  const estMej = { abierta: ["info", "Abierta"], eficaz: ["ok", "Eficaz"], "no eficaz": ["bad", "No eficaz"] };
  return `
  <section class="panel">
    <div class="panel-head"><h2>Estado del contrato ${esc(p.contrato)}</h2><span class="small muted">Inicio ${fmtDate(p.acta.fechaInicio)} · Terminación ${fmtDate(fin)}</span></div>
    <div class="bar" aria-label="Plazo transcurrido"><span style="width:${Math.round(ind.avance * 100)}%"></span></div>
    <p class="small muted">Plazo transcurrido: ${Math.round(ind.avance * 100)} % de ${p.plazoDias} días calendario.</p>
    <div class="kpis">
      ${kpi("Mediana de respuesta", dias(ind.mediana) + "<small> días háb.</small>", medCls, `P90: ${dias(ind.p90)} · plazo ${p.plazoRespuesta}`)}
      ${kpi("Solicitudes vencidas", ind.vencidas, ind.vencidas ? "bad" : "good", `${ind.abiertas} abiertas`)}
      ${kpi("NC abiertas", ind.ncAbiertas, ind.ncCriticas ? "bad" : ind.ncAbiertas ? "warn" : "good", `${ind.ncCriticas} críticas`)}
      ${kpi("Integridad", chain.ok ? "Íntegra" : "Alterada", chain.ok ? "good" : "bad", chain.ok ? `${p.asientos.length} folios encadenados` : `Revise el folio ${chain.folio}`)}
    </div>
  </section>
  <section class="panel">
    <div class="panel-head"><h3>Tablero de mejora continua (PHVA)</h3><span class="small muted">Acumulado del contrato · días hábiles sin sábados, domingos ni festivos</span></div>
    ${alertas.length ? `<p class="small"><span class="pill bad">${alertas.length} ${alertas.length === 1 ? "indicador pide" : "indicadores piden"} actuar</span> Analice la causa y registre una acción de mejora.</p>` : ""}
    <div class="table-wrap"><table><thead><tr><th>Cód.</th><th>Indicador</th><th>Valor</th><th>Meta</th><th>Estado</th><th></th></tr></thead><tbody>
      ${rows.map(r => r.length === 1 ? `<tr><td colspan="6" class="label" style="padding-top:14px">${r[0]}</td></tr>` :
        `<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td><span class="pill ${r[4][0]}">${r[4][1]}</span></td><td>${r[4][0] === "bad" && state.role === "interventor" ? `<button class="btn small" data-mejora="${r[0]}" data-valor="${esc(r[2])}">Acción de mejora</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div>
    ${state.role !== "interventor" && alertas.length ? `<p class="small muted">Las acciones de mejora las registra la interventoría.</p>` : ""}
  </section>
  <section class="panel">
    <div class="panel-head"><h3>Acciones de mejora</h3><span class="small muted">Se cierran como eficaces solo si el indicador vuelve a la meta</span></div>
    ${mejoras.length ? `<div class="table-wrap"><table><thead><tr><th>Indicador</th><th>Causa y acción</th><th>Responsable</th><th>Compromiso</th><th>Estado</th><th></th></tr></thead><tbody>
      ${mejoras.slice().reverse().map(m => `<tr><td class="mono">${esc(m.indicador)}<div class="small muted">${esc(m.valorDetectado)}</div></td><td><b>Causa:</b> ${esc(m.causa)}<div><b>Acción:</b> ${esc(m.accion)}</div></td><td>${esc(m.responsable)}</td><td>${fmtDate(m.fechaCompromiso + "T12:00")}</td><td><span class="pill ${estMej[m.estado][0]}">${estMej[m.estado][1]}</span></td><td>${m.estado === "abierta" && state.role === "interventor" ? `<div class="row"><button class="btn small" data-mej-ok="${m.id}">Eficaz</button><button class="btn small" data-mej-no="${m.id}">No eficaz</button></div>` : ""}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">Aún no hay acciones de mejora. Cuando un indicador del tablero pida actuar, la interventoría registra aquí la causa, la acción, el responsable y la fecha de compromiso.</div>`}
  </section>
  <section class="panel">
    <h3>Solicitudes abiertas</h3>
    ${openRows.length ? `<div class="table-wrap"><table><thead><tr><th>Folio</th><th>Solicitud</th><th>Vence</th><th>Estado</th></tr></thead><tbody>${openRows.map(x => `<tr><td class="mono">${x.e.folio}</td><td>${esc(x.e.solicitud.categoria)}<div class="small muted">${esc(x.e.texto.slice(0, 90))}${x.e.texto.length > 90 ? "…" : ""}</div></td><td>${fmtDate(x.e.solicitud.venceAt)}</td><td><span class="pill ${x.s.clase}">${x.s.texto}</span></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">No hay solicitudes abiertas.</p>`}
  </section>`;
}

/* ---------- vista: acta de inicio ---------- */
function viewActa(p) {
  const a = p.acta;
  const allChecks = REQUISITOS.every(([k]) => a.checks[k]);
  const req = ["contratista", "interventor"];
  const sigCard = rol => {
    const f = a.firmas[rol];
    const nombre = p[ROLES[rol].campo] || "(sin nombre)";
    const canSign = !a.suscrita && allChecks && state.role === rol && !f;
    return `<div class="sig"><span class="label">${ROLES[rol].nombre}${rol === "entidad" ? " (opcional)" : ""}</span>
      ${f ? `<img src="${f.img}" alt="Firma de ${esc(f.nombre)}"><span><b>${esc(f.nombre)}</b></span><span class="small muted">Firmó ${fmtDateTime(f.at)}</span>`
          : `<span>${esc(nombre)}</span><span class="small muted">${allChecks ? (state.role === rol ? "Puede firmar ahora." : `Cambie el rol a «${ROLES[rol].nombre}» para firmar.`) : "Pendiente: complete los requisitos."}</span>
             <div><button class="btn primary small" data-sign-acta="${rol}" ${canSign ? "" : "disabled"}>Firmar acta</button></div>`}
    </div>`;
  };
  return `
  <section class="panel">
    <div class="panel-head"><h2>Acta de inicio</h2>${a.suscrita ? `<span class="pill ok">Suscrita</span>` : `<span class="pill warn">En preparación</span>`}</div>
    <div class="grid2">
      <div class="facts"><div><span>Contrato</span><br>${esc(p.contrato)}</div><div><span>Valor</span><br>${fmtMoney(p.valor)}</div><div><span>Plazo</span><br>${p.plazoDias} días calendario</div><div><span>Plazo de respuesta acordado</span><br>${p.plazoRespuesta} días hábiles</div></div>
      <div class="facts"><div><span>Entidad</span><br>${esc(p.entidad)}</div><div><span>Contratista</span><br>${esc(p.contratista)}</div><div><span>Interventoría</span><br>${esc(p.interventoria)}</div></div>
    </div>
    <p><span class="label">Objeto</span><br>${esc(p.objeto)}</p>
  </section>
  <section class="panel">
    <div class="panel-head"><h3>Requisitos previos</h3><span class="small muted">${REQUISITOS.filter(([k]) => a.checks[k]).length} de ${REQUISITOS.length} verificados</span></div>
    <p class="small muted">El acta solo se puede firmar cuando la interventoría verifica todos los requisitos de ejecución.${state.role !== "interventor" && !a.suscrita ? " Cambie el rol a Interventoría para marcarlos." : ""}</p>
    <div class="checklist">
      ${REQUISITOS.map(([k, t, n]) => `<label class="check ${a.checks[k] ? "done" : ""}" for="chk-${k}"><input type="checkbox" id="chk-${k}" data-check="${k}" ${a.checks[k] ? "checked" : ""} ${a.suscrita || state.role !== "interventor" ? "disabled" : ""}><span>${esc(t)}<br><span class="small muted">${esc(n)}</span></span></label>`).join("")}
    </div>
  </section>
  <section class="panel">
    <div class="row"><button class="btn ${a.suscrita ? "primary" : ""}" data-pdf-acta>${a.suscrita ? "Descargar acta en PDF" : "Descargar borrador en PDF"}</button></div>
    <div class="panel-head"><h3>Firmas</h3>${a.suscrita ? `<span class="small muted">Fecha de inicio: <b>${fmtDate(a.fechaInicio)}</b> · Terminación prevista: <b>${fmtDate(a.fechaInicio + p.plazoDias * DAY)}</b></span>` : ""}</div>
    <div class="sigs">${["contratista", "interventor", "entidad"].map(sigCard).join("")}</div>
    ${!a.suscrita && req.every(r => a.firmas[r]) ? "" : ""}
  </section>`;
}

/* ---------- vista: bitácora ---------- */
function entryCard(p, e, opts = {}) {
  const t = TIPOS[e.tipo];
  let extra = "";
  if (e.tipo === "solicitud") { const s = solicitudEstado(p, e); extra = `<span class="pill ${s.clase}">${s.texto}</span><span>${esc(e.solicitud.categoria)} · vence ${fmtDate(e.solicitud.venceAt)}</span>`; }
  if (e.tipo === "respuesta") extra = `<span class="pill ok">${esc(e.decision || "Respuesta")}</span><span>Responde al folio ${e.refFolio}</span>`;
  if (e.tipo === "aclaracion") extra = `<span>Aclara el folio ${e.refFolio}</span>`;
  if (e.tipo === "noConformidad") { const s = ncEstado(p, e); extra = `<span class="pill ${s.clase}">${s.texto}</span><span>${SEVERIDAD[e.nc.severidad]} · corregir antes de ${fmtDate(e.nc.venceAt)}</span>`; }
  if (e.tipo === "correccion") extra = `<span>Corrige la no conformidad del folio ${e.refFolio}</span>`;
  if (e.tipo === "cierreNC") extra = `<span class="pill ${e.eficaz ? "ok" : "bad"}">${e.eficaz ? "Corrección eficaz" : "Corrección no eficaz"}</span><span>No conformidad del folio ${e.refFolio}</span>`;
  const tardio = isoDay(e.fechaHechos) !== isoDay(e.registradoAt);
  return `<article class="entry t-${e.tipo}" id="folio-${e.folio}">
    <div class="folio"><span class="label">Folio</span><span class="n">${String(e.folio).padStart(3, "0")}</span></div>
    <div class="body">
      <div class="meta"><b style="color:var(--ink)">${t.nombre}</b><span>${esc(e.autorNombre)} · ${ROLES[e.autorRol].nombre}</span>${extra}</div>
      <div class="meta"><span>Hechos: ${fmtDate(e.fechaHechos)}</span><span>Registrado: ${fmtDateTime(e.registradoAt)}</span>${tardio ? `<span class="pill warn">Registro tardío</span>` : ""}</div>
      ${e.tipo === "diario" ? `<div class="facts"><div><span>Clima</span><br>${esc(e.clima || "—")}</div><div><span>Personal</span><br>${esc(e.personal ?? "—")}</div><div><span>Equipos</span><br>${esc(e.equipos || "—")}</div></div><div class="text">${esc(e.actividades)}</div>` : ""}
      ${e.nc ? `<div class="small"><span class="muted">Requisito incumplido:</span> ${esc(e.nc.requisito)}</div>` : ""}
      ${e.texto ? `<div class="text">${esc(e.texto)}</div>` : ""}
      ${(e.evidencias || []).length ? `<div class="thumbs">${e.evidencias.map(v => `<figure class="thumb" style="margin:0"><img src="${v.img}" alt="Evidencia del folio ${e.folio}"><figcaption>${fmtDateTime(v.at)}${v.lat != null ? `<br>${v.lat.toFixed(4)}, ${v.lon.toFixed(4)}` : "<br>Sin ubicación"}</figcaption></figure>`).join("")}</div>` : ""}
      <div class="row" style="justify-content:space-between">
        <span class="hash" title="Huella SHA-256 encadenada">Huella ${e.hash.slice(0, 16)}… · firmado por ${esc(e.firma?.nombre || "")}</span>
        ${opts.actions !== false ? `<span class="row no-print">
          ${e.tipo === "solicitud" && !e.solicitud.respuestaFolio && state.role === "interventor" ? `<button class="btn primary small" data-respond="${e.folio}">Responder</button>` : ""}
          ${ncActions(e)}
          ${e.tipo !== "respuesta" ? `<button class="btn small" data-clarify="${e.folio}">Aclarar</button>` : ""}
          <button class="btn small" data-pdf-folio="${e.folio}">PDF</button>
        </span>` : ""}
      </div>
    </div>
  </article>`;
}
function ncActions(e) {
  if (e.tipo !== "noConformidad" || e.nc.cierreFolio) return "";
  if (!e.nc.correccionFolio && state.role === "contratista") return `<button class="btn primary small" data-correct="${e.folio}">Registrar corrección</button>`;
  if (e.nc.correccionFolio && state.role === "interventor") return `<button class="btn primary small" data-verify="${e.folio}">Verificar corrección</button>`;
  return "";
}
function viewBitacora(p) {
  if (!p.acta.suscrita) return `<section class="panel"><h2>Bitácora bloqueada</h2><p class="muted">No se pueden registrar asientos antes de suscribir el acta de inicio, porque el plazo contractual aún no corre.</p><div><button class="btn primary" data-go="acta">Ir al acta de inicio</button></div></section>`;
  const allowed = Object.entries(TIPOS).filter(([k, t]) => t.roles.includes(state.role));
  const f = state.filter || "todos";
  const list = p.asientos.filter(e => f === "todos" || e.tipo === f).slice().reverse();
  return `
  <section class="panel">
    <div class="panel-head"><h2>Bitácora de obra</h2><span class="small muted">${p.asientos.length} folios · los asientos firmados no se pueden editar</span></div>
    <div class="row"><label class="row small muted" for="diaPDF">Informe diario en PDF del <input type="date" id="diaPDF" style="width:auto" value="${state.diaPDF || isoDay(Date.now())}" max="${isoDay(Date.now())}"></label><button class="btn" data-pdf-dia>Generar PDF</button></div>
    <div class="row">${allowed.filter(([k]) => k !== "aclaracion").map(([k, t]) => `<button class="btn ${k === "diario" || k === "visita" ? "primary" : ""}" data-new="${k}">+ ${t.nombre}</button>`).join("")}</div>
  </section>
  <section class="panel">
    <div class="panel-head"><h3>Asientos</h3>
      <label class="row small muted" for="fltSel">Mostrar <select id="fltSel" style="width:auto">${[["todos", "Todos"], ...Object.entries(TIPOS).map(([k, t]) => [k, t.nombre])].map(([k, n]) => `<option value="${k}" ${f === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>
    </div>
    <div class="entries">${list.length ? list.map(e => entryCard(p, e)).join("") : `<div class="empty">Aún no hay asientos de este tipo. Use los botones de arriba para registrar el primero.</div>`}</div>
  </section>`;
}

/* ---------- vista: solicitudes ---------- */
function viewSolicitudes(p, ind) {
  if (!p.acta.suscrita) return viewBitacora(p);
  const rows = p.asientos.filter(e => e.tipo === "solicitud").map(e => ({ e, s: solicitudEstado(p, e) }));
  const order = { bad: 0, warn: 1, info: 2, ok: 3 };
  rows.sort((a, b) => (a.s.cerrada - b.s.cerrada) || (order[a.s.clase] - order[b.s.clase]) || a.e.solicitud.venceAt - b.e.solicitud.venceAt);
  return `
  <section class="panel">
    <div class="panel-head"><h2>Solicitudes a la interventoría</h2>${state.role === "contratista" ? `<button class="btn primary" data-new="solicitud">+ Nueva solicitud</button>` : ""}</div>
    <p class="small muted">Cada solicitud vence ${p.plazoRespuesta} días hábiles después de registrada (plazo pactado en el acta de inicio; no cuentan sábados, domingos ni festivos). La respuesta queda como un folio vinculado y el tiempo se mide automáticamente.</p>
    <div class="row small"><span class="pill info">En plazo</span><span class="pill warn">Por vencer (menos de 1 día hábil)</span><span class="pill bad">Vencida o respondida tarde</span><span class="pill ok">Respondida a tiempo</span></div>
    ${rows.length ? `<div class="table-wrap"><table><thead><tr><th>Folio</th><th>Solicitud</th><th>Registrada</th><th>Vence</th><th>Días háb.</th><th>Estado</th><th></th></tr></thead><tbody>
      ${rows.map(({ e, s }) => `<tr><td class="mono">${e.folio}</td><td><b>${esc(e.solicitud.categoria)}</b><div class="small muted">${esc(e.texto)}</div>${e.solicitud.respuestaFolio ? `<div class="small">Respuesta en folio ${e.solicitud.respuestaFolio}</div>` : ""}</td><td>${fmtDate(e.registradoAt)}</td><td>${fmtDate(e.solicitud.venceAt)}</td><td class="num">${s.dias.toFixed(1).replace(".", ",")}</td><td><span class="pill ${s.clase}">${s.texto}</span></td><td>${!s.cerrada && state.role === "interventor" ? `<button class="btn primary small" data-respond="${e.folio}">Responder</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">No hay solicitudes registradas. El contratista las crea desde aquí o desde la bitácora.</div>`}
    ${state.role !== "interventor" && ind.abiertas ? `<p class="small muted">Para responder, cambie el rol a Interventoría.</p>` : ""}
  </section>`;
}

/* ---------- vista: no conformidades ---------- */
function viewNC(p, ind) {
  if (!p.acta.suscrita) return viewBitacora(p);
  const rows = p.asientos.filter(e => e.tipo === "noConformidad").map(e => ({ e, s: ncEstado(p, e) }));
  const sevOrd = { critica: 0, mayor: 1, menor: 2 };
  rows.sort((a, b) => (a.s.cerrada - b.s.cerrada) || (sevOrd[a.e.nc.severidad] - sevOrd[b.e.nc.severidad]) || a.e.nc.venceAt - b.e.nc.venceAt);
  return `
  <section class="panel">
    <div class="panel-head"><h2>No conformidades</h2>${state.role === "interventor" ? `<button class="btn primary" data-new="noConformidad">+ Nueva no conformidad</button>` : ""}</div>
    <p class="small muted">La interventoría registra el requisito incumplido y la severidad; el plazo de corrección se fija por severidad (crítica ${p.plazosNC.critica}, mayor ${p.plazosNC.mayor}, menor ${p.plazosNC.menor} días hábiles). El contratista registra la corrección y la acción correctiva, y la interventoría cierra la no conformidad solo después de verificar en campo que la corrección es eficaz.</p>
    ${rows.length ? `<div class="table-wrap"><table><thead><tr><th>Folio</th><th>No conformidad</th><th>Severidad</th><th>Vence</th><th>Estado</th><th></th></tr></thead><tbody>
      ${rows.map(({ e, s }) => `<tr><td class="mono">${e.folio}</td><td><b>${esc(e.nc.requisito)}</b><div class="small muted">${esc(e.texto)}</div>${e.nc.correccionFolio ? `<div class="small">Corrección en folio ${e.nc.correccionFolio}${e.nc.cierreFolio ? ` · cierre en folio ${e.nc.cierreFolio}` : ""}</div>` : ""}</td><td><span class="pill ${e.nc.severidad === "critica" ? "bad" : e.nc.severidad === "mayor" ? "warn" : "idle"}">${SEVERIDAD[e.nc.severidad]}</span></td><td>${fmtDate(e.nc.venceAt)}</td><td><span class="pill ${s.clase}">${s.texto}</span></td><td>${ncActions(e)}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">No hay no conformidades registradas.</div>`}
  </section>`;
}

/* ---------- PDF automáticos (M6) ---------- */
function imgSize(src) { return new Promise(res => { const i = new Image(); i.onload = () => res([i.naturalWidth, i.naturalHeight]); i.onerror = () => res([4, 3]); i.src = src; }); }
const imgFmt = src => /^data:image\/png/.test(src) ? "PNG" : "JPEG";
async function deliverPDF(doc, filename) {
  if (!framed) { doc.save(filename); return toast("PDF generado: " + filename); }
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if (!dl) return toast("Este visor no permite descargar archivos. Use la versión local de la aplicación.");
  try { await dl.save({ filename, data: doc.output("blob") }); toast("PDF guardado: " + filename); }
  catch (e) { if (e && e.code === "declined") return; toast(e && e.code === "rate_limited" ? "Ya hay una descarga pendiente de confirmar." : "No se pudo guardar el PDF en este visor."); }
}
// Documento base: carta, márgenes de 15 mm, encabezado con logo de la interventoría y pie con fecha y paginación.
async function newPDF(p, titulo, subtitulo) {
  if (!window.jspdf) { toast("No se pudo cargar el generador de PDF. Revise la conexión y recargue."); return null; }
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter", compress: true });
  const W = 215.9, H = 279.4, M = 15;
  const logo = p.logo ? { src: p.logo, size: await imgSize(p.logo) } : null;
  const ctx = { doc, p, W, H, M, y: 0, titulo, subtitulo, logo, generado: Date.now() };
  header(ctx);
  return ctx;
}
function header(c) {
  const { doc, p, W, M } = c;
  let x = M;
  if (c.logo) {
    const [w, h] = c.logo.size; const s = Math.min(38 / w, 18 / h);
    doc.addImage(c.logo.src, imgFmt(c.logo.src), M, 10, w * s, h * s); x = M + w * s + 6;
  }
  doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(24, 34, 43);
  doc.text(p.interventoria || "Interventoría", x, 14);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(91, 104, 117);
  doc.text(doc.splitTextToSize(`Contrato ${p.contrato} · ${p.entidad}`, W - x - M - 52).slice(0, 2), x, 19);
  doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(31, 79, 143);
  doc.text(c.titulo, W - M, 14, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(91, 104, 117);
  if (c.subtitulo) doc.text(c.subtitulo, W - M, 19, { align: "right" });
  doc.setDrawColor(31, 79, 143); doc.setLineWidth(0.5); doc.line(M, 30, W - M, 30);
  c.y = 37;
}
function ensure(c, h) { if (c.y + h > c.H - 20) { c.doc.addPage(); header(c); } }
function footers(c) {
  const { doc, W, H, M } = c; const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setDrawColor(211, 218, 224); doc.setLineWidth(0.2); doc.line(M, H - 14, W - M, H - 14);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(91, 104, 117);
    doc.text(`Generado con BitaObra el ${fmtDateTime(c.generado)}`, M, H - 9);
    doc.text(`Página ${i} de ${n}`, W - M, H - 9, { align: "right" });
  }
}
function h2(c, t) { ensure(c, 12); c.doc.setFont("helvetica", "bold"); c.doc.setFontSize(11); c.doc.setTextColor(24, 34, 43); c.doc.text(t, c.M, c.y); c.y += 6; }
function para(c, t, opt = {}) {
  if (!t) return;
  const { doc, W, M } = c; const size = opt.size || 9.5;
  doc.setFont("helvetica", opt.bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor(...(opt.color || [24, 34, 43]));
  const lines = doc.splitTextToSize(String(t), W - 2 * M - (opt.indent || 0));
  for (const ln of lines) { ensure(c, size * 0.45); doc.text(ln, M + (opt.indent || 0), c.y); c.y += size * 0.45; }
  c.y += opt.after ?? 2;
}
// Tabla de pares etiqueta / valor en dos columnas.
function fields(c, pairs) {
  const { doc, W, M } = c; const colW = (W - 2 * M) / 2;
  for (let i = 0; i < pairs.length; i += 2) {
    const row = pairs.slice(i, i + 2);
    const blocks = row.map(([k, v]) => doc.splitTextToSize(String(v ?? "—"), colW - 4));
    const h = 5 + Math.max(...blocks.map(b => b.length)) * 4.2;
    ensure(c, h);
    row.forEach(([k], j) => {
      const x = M + j * colW;
      doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(91, 104, 117); doc.text(k.toUpperCase(), x, c.y);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(24, 34, 43); doc.text(blocks[j], x, c.y + 4.5);
    });
    c.y += h + 1.5;
  }
}
async function photos(c, evid) {
  if (!evid || !evid.length) return;
  const { doc, W, M } = c; const colW = (W - 2 * M - 6) / 2;
  for (let i = 0; i < evid.length; i += 2) {
    const row = evid.slice(i, i + 2);
    const sizes = await Promise.all(row.map(v => imgSize(v.img)));
    const hs = sizes.map(([w, h]) => Math.min(colW * h / w, 70));
    const rowH = Math.max(...hs) + 10;
    ensure(c, rowH);
    row.forEach((v, j) => {
      const [w, h] = sizes[j]; const ih = hs[j]; const iw = ih * w / h; const x = M + j * (colW + 6);
      doc.addImage(v.img, imgFmt(v.img), x, c.y, iw, ih);
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(91, 104, 117);
      doc.text(`Foto: ${fmtDateTime(v.at)}${v.lat != null ? ` · GPS ${v.lat.toFixed(5)}, ${v.lon.toFixed(5)}` : " · sin ubicación"}`, x, c.y + ih + 4);
    });
    c.y += rowH;
  }
}
async function signatures(c, firmas) {
  const list = firmas.filter(Boolean);
  if (!list.length) return;
  const { doc, W, M } = c; const colW = (W - 2 * M) / 3;
  ensure(c, 34);
  for (let i = 0; i < list.length; i++) {
    const f = list[i]; const x = M + (i % 3) * colW;
    if (i && i % 3 === 0) { c.y += 34; ensure(c, 34); }
    const [w, h] = await imgSize(f.img); const s = Math.min((colW - 8) / w, 16 / h);
    doc.addImage(f.img, imgFmt(f.img), x, c.y, w * s, h * s);
    doc.setDrawColor(24, 34, 43); doc.setLineWidth(0.3); doc.line(x, c.y + 18, x + colW - 8, c.y + 18);
    doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(24, 34, 43); doc.text(f.nombre, x, c.y + 22);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(91, 104, 117);
    doc.text(`${f.rol ? f.rol + " · " : ""}firmó ${fmtDateTime(f.at)}`, x, c.y + 26);
  }
  c.y += 32;
}
function entryTitle(p, e) {
  let t = `Folio ${String(e.folio).padStart(3, "0")} · ${TIPOS[e.tipo].nombre}`;
  if (e.refFolio) t += ` (folio ${e.refFolio})`;
  return t;
}
async function entryBlock(c, e) {
  const p = c.p;
  ensure(c, 30);
  c.doc.setFillColor(227, 236, 247); c.doc.rect(c.M, c.y - 4.5, c.W - 2 * c.M, 7, "F");
  h2(c, entryTitle(p, e));
  const pairs = [["Fecha de los hechos", fmtDate(e.fechaHechos)], ["Registrado", fmtDateTime(e.registradoAt)], ["Autor", `${e.autorNombre} (${ROLES[e.autorRol].nombre})`]];
  if (e.tipo === "diario") pairs.push(["Clima", e.clima || "—"], ["Personal en obra", e.personal || "—"], ["Equipos", e.equipos || "—"]);
  if (e.solicitud) { const s = solicitudEstado(p, e); pairs.push(["Categoría", e.solicitud.categoria], ["Vence", fmtDate(e.solicitud.venceAt)], ["Estado", s.texto]); }
  if (e.nc) { const s = ncEstado(p, e); pairs.push(["Requisito incumplido", e.nc.requisito], ["Severidad", SEVERIDAD[e.nc.severidad]], ["Corregir antes de", fmtDate(e.nc.venceAt)], ["Estado", s.texto]); }
  if (e.tipo === "respuesta") pairs.push(["Decisión", e.decision || "—"]);
  if (e.tipo === "cierreNC") pairs.push(["Resultado", e.eficaz ? "Corrección eficaz" : "Corrección no eficaz"]);
  fields(c, pairs);
  if (e.tipo === "diario") { para(c, "Actividades ejecutadas", { bold: true, size: 9, after: 1 }); para(c, e.actividades); }
  if (e.texto) { para(c, e.tipo === "diario" ? "Observaciones" : "Descripción", { bold: true, size: 9, after: 1 }); para(c, e.texto); }
  if ((e.evidencias || []).length) { para(c, `Registro fotográfico (${e.evidencias.length})`, { bold: true, size: 9, after: 2 }); await photos(c, e.evidencias); }
  if (e.firma) await signatures(c, [{ ...e.firma, rol: ROLES[e.autorRol].nombre }]);
  para(c, `Huella SHA-256: ${e.hash}`, { size: 7, color: [91, 104, 117], after: 6 });
}
async function pdfActa(p) {
  const a = p.acta;
  const c = await newPDF(p, "ACTA DE INICIO", a.suscrita ? `Suscrita el ${fmtDate(a.fechaInicio)}` : "BORRADOR · sin suscribir");
  if (!c) return;
  fields(c, [["Contrato", p.contrato], ["Valor", fmtMoney(p.valor)], ["Entidad contratante", p.entidad], ["Contratista", p.contratista], ["Interventoría", p.interventoria], ["Municipio", p.municipio || "—"],
    ["Plazo de ejecución", `${p.plazoDias} días calendario`], ["Fecha de inicio", a.suscrita ? fmtDate(a.fechaInicio) : "Pendiente"],
    ["Fecha de terminación prevista", a.suscrita ? fmtDate(a.fechaInicio + p.plazoDias * DAY) : "Pendiente"], ["Plazo de respuesta a solicitudes", `${p.plazoRespuesta} días hábiles`],
    ["Plazos de corrección de no conformidades", `Crítica ${p.plazosNC.critica}, mayor ${p.plazosNC.mayor}, menor ${p.plazosNC.menor} días hábiles`]]);

  para(c, a.suscrita ? `Verificados los requisitos anteriores, las partes acuerdan dar inicio a la ejecución del contrato el ${fmtDate(a.fechaInicio)}. Los plazos de respuesta y de corrección aquí pactados rigen la bitácora de obra.` : "Documento en borrador: el acta aún no ha sido firmada por todas las partes.", { after: 6 });
  h2(c, "Firmas");

}
async function pdfFolio(p, folio) {
  const e = p.asientos.find(x => x.folio === folio);

async function pdfPeriodo(p, desde, hasta) {
  const list = p.asientos.filter(e => isoDay(e.fechaHechos) >= desde && isoDay(e.fechaHechos) <= hasta);

}
async function runPDF(btn, fn) {

/* ---------- diálogos ---------- */
function openDialog(html, onMount) {
  const L = $("#layer");
  L.innerHTML = `<div class="dialog-back" role="dialog" aria-modal="true"><div class="dialog">${html}</div></div>`;
  const back = L.firstElementChild;
  back.addEventListener("click", ev => { if (ev.target === back) closeDialog(); });

  onMount && onMount(back);

function closeDialog() { $("#layer").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDialog(); });

function signaturePad(canvas) {
  const ctx = canvas.getContext("2d");
  let drawing = false, dirty = false;
  const fit = () => { const r = canvas.getBoundingClientRect(); canvas.width = r.width * 2; canvas.height = r.height * 2; ctx.scale(2, 2); ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.strokeStyle = "#173a73"; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, r.width, r.height); };
  fit();
  const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  canvas.addEventListener("pointerdown", e => { drawing = true; canvas.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); });
  canvas.addEventListener("pointermove", e => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); dirty = true; });
  canvas.addEventListener("pointerup", () => drawing = false);
  return { isEmpty: () => !dirty, clear: () => { dirty = false; fit(); }, data: () => canvas.toDataURL("image/png") };
}

function readImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 900 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = img.width * s; c.height = img.height * s; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", 0.7)); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function getPosition() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    try { navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), () => res(null), { timeout: 6000, maximumAge: 60000 }); }
    catch (e) { res(null); }
  });
}

    const keep = state.projects.filter(x => !x.ejemplo); const s = buildSample(); state.projects = [s, ...keep]; state.current = s.id; save(); render(); toast("Ejemplo restablecido.");
  });
  const del = v.querySelector("[data-delete]"); if (del) del.onclick = () => dlgConfirm(`Se elimina el proyecto ${p.contrato} y toda su bitácora de este dispositivo. Exporte un respaldo antes si lo necesita.`, "Eliminar proyecto", () => {
    state.projects = state.projects.filter(x => x.id !== p.id); if (!state.projects.length) state.projects.push(buildSample()); state.current = state.projects[0].id; save(); render(); toast("Proyecto eliminado.");
  });
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
$("#roleSel").addEventListener("change", e => { state.role = e.target.value; save(); render(); toast("Ahora actúa como " + ROLES[state.role].nombre + "."); });
$("#projSel").addEventListener("change", e => { if (e.target.value === "__new") { e.target.value = state.current; return dlgNewProject(); } state.current = e.target.value; save(); render(); });

/* ---------- arranque ---------- */
state = load();
if (!state || !state.projects || !state.projects.length) { state = freshState(); save(); }
else {
  // Datos guardados por la versión anterior: el ejemplo se regenera y los proyectos propios reciben los campos nuevos.
  state.projects = state.projects.map(x => x.ejemplo && !x.plazosNC ? buildSample() : x);
  state.projects.forEach(x => { x.plazosNC = x.plazosNC || { critica: 1, mayor: 5, menor: 10 }; x.mejoras = x.mejoras || []; });
  if (!state.projects.some(x => x.id === state.current)) state.current = state.projects[0].id;
  save();
}
render();
if (!framed && "serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
